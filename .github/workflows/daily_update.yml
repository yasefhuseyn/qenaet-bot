name: Qenaet Daily Catalog Update

on:
  schedule:
    - cron: '10 20 * * *'   # 00:10 Bakı — Apify ilə tam
    - cron: '10 8 * * *'    # 12:10 Bakı — Apify ilə tam
    - cron: '10 0,4,12,16 * * *'   # 04:10, 08:10, 16:10, 20:10 Bakı — yüngül (Telegram + saytlar)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sınaq rejimi (Firestore-a yazmır, nəticəni Artifacts-də verir)'
        type: boolean
        default: false
      clear_catalog:
        description: 'Bütün məhsulları sil (heç nə yeniləmir)'
        type: boolean
        default: false
      use_apify:
        description: 'Apify (Instagram/Facebook) istifadə olunsun (kredit xərcləyir)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: qenaet-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Paketləri quraşdır
        run: pip install -r requirements.txt
      - name: Rejimi təyin et (Apify yalnız tam işləmələrdə)
        run: |
          # Fokus Telegram kanallarındadır; Instagram/Facebook (Apify) yalnız əllə, "use_apify" seçiləndə işləyir
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "USE_APIFY=${{ inputs.use_apify == true && '1' || '0' }}" >> "$GITHUB_ENV"
          else
            echo "USE_APIFY=0" >> "$GITHUB_ENV"
          fi
      - name: Gündəlik yeniləməni işə sal
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEAR_CATALOG: ${{ inputs.clear_catalog && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python daily_updater.py
      - name: Nəticəni saxla (sınaq rejimi)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-output
          path: out/
      - name: Kəsilmiş məhsul şəkillərini repoya yüklə
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "qenaet-bot"
          git config user.email "qenaet-bot@users.noreply.github.com"
          git add -A product_images
          if ! git diff --cached --quiet; then
            git commit -m "Məhsul şəkilləri yeniləndi"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
